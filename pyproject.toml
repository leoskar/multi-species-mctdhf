[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-species-mctdhf"
version = "0.8.0"
description = "Multi-species MCTDHF and ML-MCTDHF in JAX with semi-direct CI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Oskar Leinonen"},
]

dependencies = [
    "jax>=0.4",
    "jaxlib>=0.4",
    "numpy>=1.24",
    "scipy>=1.10",
    "opt-einsum>=3.3",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
adaptive = ["diffrax>=0.4"]
cuda12 = ["jax[cuda12]"]
cpu = ["jax[cpu]"]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/leoskar/multi-species-mctdhf"

[tool.setuptools.packages.find]
include = ["mctdhf*"]
